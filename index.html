<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahoy, Kapten zuca! 🏴‍☠️</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Pacifico&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#4a2f17;--soft:#7a5c3a;--pk:#a8321f;--pkd:#7e2316;--cream:#fff8e3;--paper:#f7e8bf;--gold:#c9922b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;max-width:100%}
*{box-sizing:border-box;min-width:0}
button{touch-action:manipulation;font-family:inherit}
body{margin:0;max-width:100%;overflow-x:hidden;background:linear-gradient(180deg,#8fd0e0 0,#d7f0ea 36%,#f6e2ae 100%);background-attachment:fixed;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700;font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
main{width:100%;max-width:480px;margin:0 auto;padding:22px 14px 100px}
[hidden]{display:none!important}
h1{font-family:"Pirata One",serif;font-weight:400;font-size:2.4rem;line-height:1.1;margin:0 0 6px;color:#a8321f;text-align:center;letter-spacing:.02em}
.intro{margin:0 0 14px;color:var(--soft);text-align:center;font-weight:600}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 12px}
.chip{padding:5px 14px;border-radius:999px;background:#fff8e3;border:3px solid var(--ink);font:800 .92rem Nunito,sans-serif;color:var(--ink)}
button.chip{cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button.chip:active{transform:translateY(3px);box-shadow:none}
.now{margin:0 0 16px;padding:12px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--cream);text-align:center}
.map{position:relative;aspect-ratio:2/5;border:4px double #8b5a2b;border-radius:20px;overflow:hidden;background:#c9edf5}
#svg{position:absolute;left:0;top:0;width:100%;height:100%}
.fog{position:absolute;left:0;right:0;top:0;height:0;z-index:2;pointer-events:none;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;transition:height 1.2s ease;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.6) 0,transparent 24%),radial-gradient(circle at 78% 58%,rgba(255,255,255,.55) 0,transparent 26%),radial-gradient(circle at 40% 88%,rgba(255,255,255,.5) 0,transparent 22%),linear-gradient(to bottom,#e6dabf 0,#e6dabf 90%,rgba(230,218,191,0) 100%)}
.fog p{margin:0 0 30px;padding:0 20px;font-size:.9rem;color:#7a6a48;text-align:center}
.pin{position:absolute;z-index:3;width:56px;height:56px;margin:-28px 0 0 -28px;padding:0;border:4px solid #8b5a2b;border-radius:50%;background:var(--paper);box-shadow:0 4px 0 #8b5a2b;font-size:1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .8s}
.pin:active{transform:translateY(3px);box-shadow:0 1px 0 #8b5a2b}
.pe{line-height:1}
.st-lockd{background:#e3d6b0;border-color:#a08b63;box-shadow:0 4px 0 #a08b63}
.st-lockd .pe{opacity:.6}
.st-open{background:#fff2c2;border-color:var(--gold);box-shadow:0 4px 0 var(--gold);animation:pulse 1.6s infinite}
.st-open .pe{color:#c0392b;font-weight:900;font-size:1.9rem}
.chest.st-open .pe{color:inherit}
.st-done{background:#fff;border-color:var(--gold);box-shadow:0 4px 0 var(--gold)}
.pin.fogd{opacity:.2}
.pb{position:absolute;right:-8px;bottom:-4px;min-width:26px;height:26px;padding:0 4px;border:3px solid var(--ink);border-radius:50%;background:#fff;font-size:.78rem;line-height:20px;text-align:center;font-weight:800}
.pb:empty{display:none}
.st-done .pb{background:var(--gold);color:#fff}
.chest{width:66px;height:66px;margin:-33px 0 0 -33px;font-size:2rem}
@keyframes pulse{0%{box-shadow:0 4px 0 var(--gold),0 0 0 0 rgba(201,146,43,.65)}70%{box-shadow:0 4px 0 var(--gold),0 0 0 16px rgba(201,146,43,0)}100%{box-shadow:0 4px 0 var(--gold),0 0 0 0 rgba(201,146,43,0)}}
.pt{position:absolute;z-index:3;transform:translateX(-50%);padding:0 8px;border:2px solid var(--ink);border-radius:999px;background:var(--cream);font-size:.72rem;font-weight:800;line-height:1.5;pointer-events:none;transition:opacity .8s;white-space:nowrap}
.pt.fogd{opacity:0}
#boat{position:absolute;z-index:4;left:24%;top:86%;margin:-66px 0 0 4px;font-size:2rem;line-height:1;pointer-events:none;transition:left 1.4s ease,top 1.4s ease}
#boat span{display:block;animation:bob2 2s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.nav{display:block;width:100%;margin-top:12px;padding:15px 12px;border:3px solid var(--ink);border-radius:16px;background:var(--pk);color:#fff;font:800 1.1rem Nunito,sans-serif;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.nav:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.nav:disabled{opacity:.55}
.nav.alt{background:#fff;color:var(--ink)}
.pin:focus-visible,.nav:focus-visible,.chip:focus-visible,.big:focus-visible,.mc:focus-visible,.sfxb:focus-visible,.mus:focus-visible{outline:3px solid #a8321f;outline-offset:3px}
.slot{display:flex;align-items:center;justify-content:center;min-height:280px;border:4px dashed var(--ink);border-radius:20px;background:rgba(255,248,227,.8)}
.cbig{font-size:6rem;line-height:1}
.cbig.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg)}35%{transform:rotate(10deg)}55%{transform:rotate(-8deg)}75%{transform:rotate(6deg)}}
.stamp{width:230px;height:230px;border:6px solid #a8321f;border-radius:50%;box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 9px #a8321f;background:#fff;color:#a8321f;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;transform:rotate(-8deg)}
.stamp b{font-family:"Pirata One",serif;font-weight:400;font-size:1.5rem;line-height:1.1}
.stamp span{display:block;font-size:1rem;line-height:1.3;color:var(--ink);margin:5px 0}
.stamp em{display:block;font-style:normal;font-size:.82rem}
.stamp.hit{animation:hit .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes hit{from{transform:rotate(-20deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.cf{position:fixed;z-index:60;font-size:1.7rem;pointer-events:none;animation:cf 1.5s ease-out forwards}
@keyframes cf{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
@media (prefers-reduced-motion:reduce){.stamp.hit,.st-open,.cbig.shake,#boat span{animation:none}.cf{display:none}}
.end{margin:22px 0 0;text-align:center;font-family:Pacifico,cursive;font-size:1.3rem;line-height:1.5;color:#a8321f;font-weight:400}
.end small{display:block;font-family:Nunito,sans-serif;font-size:.9rem;color:var(--soft);margin-top:6px;font-weight:600}
.ov{position:fixed;inset:0;z-index:10;background:rgba(74,47,23,.6);display:flex;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom))}
.box{width:100%;max-width:440px;margin:auto;background:var(--cream);border:4px solid var(--ink);border-radius:20px;padding:16px}
.box .nav{margin-top:12px}
.deed{border:3px solid var(--ink);background:#fff;text-align:center;padding:0 12px 14px}
.dh{height:18px;margin:0 -12px 10px;background:repeating-linear-gradient(45deg,#c9922b 0 12px,#e8c35f 12px 24px);border-bottom:3px solid var(--ink)}
.dk{margin:0;font-size:.78rem;letter-spacing:.1em;color:var(--soft)}
.dt{margin:2px 0;font-family:"Pirata One",serif;font-size:1.8rem;font-weight:400}
.dm{margin:4px 0;font-size:1.05rem}
.dm b{font-size:1.6rem}
.dq{margin:6px 0;font-weight:600;font-style:italic;color:var(--soft)}
.dp{margin:8px 0 0;padding-top:8px;border-top:2px dashed var(--ink);font-size:.95rem}
.cl{margin:0 0 10px;text-align:left;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff}
.cl.no{background:#efe4c4;color:var(--soft)}
.cl b{display:block}
.cl span{font-weight:600;font-size:.92rem}
.gt{font-family:"Pirata One",serif;font-weight:400;font-size:1.3rem;line-height:1.3;color:var(--pk);margin:0 0 4px}
.gd{margin:0 0 14px;color:var(--soft);font-weight:600}
.gs{margin:14px 0 0;font-size:1.1rem;font-weight:800;text-align:center;min-height:1.5em}
.big{display:block;width:100%;height:170px;border:3px solid var(--ink);border-radius:22px;background:#ffe08a;color:var(--ink);font:800 1.1rem Nunito,sans-serif;line-height:1.8;box-shadow:0 6px 0 var(--ink);cursor:pointer}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.big span{font-size:3rem}
.big.wait{background:#ffb4a8}.big.go{background:#8fe3a8}
.winp{text-align:center;font-size:4rem;line-height:1.4;padding:20px 0}
.shl{position:relative;height:150px}
.cup{position:absolute;left:1.7%;top:30px;width:30%;height:96px;padding:0;border:0;background:none;font-size:3.2rem;cursor:pointer;transition:transform .4s}
.cup .ci{display:block;line-height:1;transition:transform .25s}
.cup .bl{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:1.7rem;visibility:hidden}
.cup.up .ci{transform:translateY(-34px)}
.cup.up .bl{visibility:visible}
.xg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.xc{height:64px;padding:0;border:3px solid var(--ink);border-radius:14px;background:#e8cf8f;font-size:1.7rem;cursor:pointer}
.xc:disabled{background:#fff;opacity:1}
.qq{font-size:1.1rem;font-weight:800;margin:0 0 6px}
.qb{display:block;width:100%;margin-top:10px;padding:13px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font:800 1rem Nunito,sans-serif;text-align:left;cursor:pointer}
.mq{font-size:2.2rem;text-align:center;font-weight:800;margin:0 0 10px}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.og .qb{text-align:center;margin-top:0;font-size:1.4rem}
.spg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spt{height:84px;padding:0;border:3px solid var(--ink);border-radius:14px;background:#ffe08a;color:var(--ink);font:800 2rem Nunito,sans-serif;cursor:pointer}
.spt.e{visibility:hidden}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hl{height:78px;padding:0;border:3px solid var(--ink);border-radius:50%;background:#d7b98a;font-size:2.2rem;line-height:1;cursor:pointer}
.odg{display:grid;gap:6px}
.odc{aspect-ratio:1;padding:0;border:2px solid var(--ink);border-radius:10px;background:#fff;font-size:1.5rem;line-height:1;cursor:pointer}
.nvg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:12px}
.nvc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.6rem;line-height:1;background:#bfe6f2;border:2px solid #8bb6c4;border-radius:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto}
.pad button{height:56px;padding:0;border:3px solid var(--ink);border-radius:14px;background:#ffe08a;font-size:1.5rem;cursor:pointer}
.mus,.sfxb{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;width:54px;height:54px;padding:0;border:3px solid var(--ink);border-radius:50%;background:#fff;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.mus{right:14px}.sfxb{right:78px;font-size:1.3rem}
.mus.on{background:#ffe08a}
.lk{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;text-align:center;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;background:linear-gradient(170deg,#7cc4d8 0,#cfeae6 50%,#f4d9a0 100%);padding:max(48px,calc(env(safe-area-inset-top,0px) + 32px)) 24px max(36px,calc(env(safe-area-inset-bottom,0px) + 24px));transition:transform .55s cubic-bezier(.3,.8,.3,1),opacity .55s}
.lk.open{transform:translateY(-100%);opacity:0;pointer-events:none}
.lk:focus-visible{outline:4px solid var(--pkd);outline-offset:-8px}
.lk-date{margin:0;font-weight:800;color:var(--ink)}
.lk-time{margin:0;font-size:4.6rem;line-height:1.1;font-weight:800;color:var(--ink)}
.lk-title{margin:28px 0 4px;font-family:"Pirata One",serif;font-size:2.2rem;color:var(--pk)}
.lk-sub{margin:0;color:var(--soft);font-weight:700}
.lk-bot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.chev{font-size:1.8rem;line-height:1;color:var(--pkd);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
.lk-go{margin:0;padding:14px 34px;border:3px solid var(--ink);border-radius:16px;background:var(--pk);color:#fff;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--ink)}
.lk-hint{margin:0;font-size:.85rem;color:var(--soft)}
@media (prefers-reduced-motion:reduce){.chev{animation:none}.lk{transition:opacity .3s}.lk.open{transform:none}}

</style>
</head>
<body>

var pairs=shuf([["🦀","🦞"],["🐙","🦑"],["🐟","🐠"],["🏴‍☠️","🏴"],["🍎","🍅"]]),sizes=[3,4,5],r=0,ga=$("ga");
function round(){
clr();
var n=sizes[r],p=pairs[r],odd=rnd(n*n);
ga.innerHTML='<div class="odg" style="grid-template-columns:repeat('+n+',1fr)"></div>';
for(var i=0;i<n*n;i++){(function(i){
var b=document.createElement("button");b.type="button";b.className="odc";b.textContent=i===odd?p[1]:p[0];b.setAttribute("aria-label","Petak "+(i+1));
b.addEventListener("click",function(){
if(i!==odd){lose("Salah pilih! Coba lagi 😆");return}
sfx("coin");r++;if(r>=3)win();else round();
});
ga.firstChild.appendChild(b);
})(i)}
var end=Date.now()+12000;
timers.push(setInterval(function(){
var l=Math.max(0,(end-Date.now())/1000);
$("gs").textContent="Ronde "+(r+1)+"/3 · "+l.toFixed(1)+" dtk";
if(l<=0)lose("Waktu habis! Coba lagi 😆");
},100));
}
round();
}
function g8(){
var rk,pr=4,pc=0,mv=0,ga=$("ga");
function reach(m){
var seen={"4,0":1},q=[[4,0]];
while(q.length){
var c=q.shift();if(c[0]===0&&c[1]===4)return true;
[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var r=c[0]+d[0],cc=c[1]+d[1],k=r+","+cc;if(r>=0&&r<5&&cc>=0&&cc<5&&!seen[k]&&!m[k]){seen[k]=1;q.push([r,cc])}});
}
return false;
}
do{rk={};while(Object.keys(rk).length<7){var rr=rnd(5),cc2=rnd(5),kk=rr+","+cc2;if(kk!=="4,0"&&kk!=="0,4")rk[kk]=1}}while(!reach(rk));
function draw(){
var h='<div class="nvg">';
for(var r=0;r<5;r++)for(var c=0;c<5;c++){h+='<div class="nvc">'+(r===pr&&c===pc?"⛵":(r===0&&c===4?"🏝️":(rk[r+","+c]?"🪨":"")))+'</div>'}
h+='</div><div class="pad"><span></span><button type="button" data-d="u" aria-label="Atas">⬆️</button><span></span><button type="button" data-d="l" aria-label="Kiri">⬅️</button><button type="button" data-d="d" aria-label="Bawah">⬇️</button><button type="button" data-d="r" aria-label="Kanan">➡️</button></div>';
ga.innerHTML=h;
ga.querySelectorAll(".pad button").forEach(function(b){b.addEventListener("click",function(){go(this.dataset.d)})});
}
function go(d){
var r=pr+(d==="d"?1:d==="u"?-1:0),c=pc+(d==="r"?1:d==="l"?-1:0);
if(r<0||r>4||c<0||c>4||rk[r+","+c]){$("gs").textContent="Menabrak karang! 🪨";sfx("err");buzz(60);return}
pr=r;pc=c;mv++;sfx("tap");
if(r===0&&c===4){win();return}
$("gs").textContent="Langkah "+mv;draw();
}
draw();$("gs").textContent="Langkah 0";
}
/* ----- peti & cap ----- */
function burst(){
if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
var e=["🪙","💎","🏴‍☠️","⚓","🦜"];
for(var i=0;i<16;i++){
var s=document.createElement("span");s.className="cf";s.textContent=e[i%e.length];
s.style.left=(30+Math.random()*40)+"%";s.style.top="45%";
s.style.setProperty("--dx",(Math.random()*240-120)+"px");s.style.setProperty("--dy",(Math.random()*-260-40)+"px");
document.body.appendChild(s);setTimeout(function(x){x.remove()},1600,s);
}
}
function showStamp(anim,d){
$("sdate").textContent=d;$("stc").textContent="Harta "+saved.length+"/"+items.length+" 💎";
$("cbig").hidden=true;$("stamp").hidden=false;if(anim){$("stamp").classList.add("hit");burst()}

}

if(cap||!allDone())return;
sfx("tap");buzz(80);$("cbig").classList.add("shake");
setTimeout(function(){
cap=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
save();sfx("fan");buzz([60,40,60,40,120]);showStamp(true,cap);refresh();
},700);
});
if(cap)showStamp(false,cap);
refresh();
var bgm=$("bgm"),mus=$("mus"),lk=$("lk"),HK="harta-started",wasOn=false;
var started=false;
try{started=!!localStorage.getItem(HK)}catch(e){}
if(saved.length>0||cap)started=true;
$("lkgo").textContent=started?TEXT.contBtn:TEXT.startBtn;
var mainEl=document.querySelector("main");
mainEl.inert=true;mus.inert=true;document.body.style.overflow="hidden";
function tick(){
var d=new Date();
$("lkt").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
$("lkd").textContent=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
}
tick();var tk=setInterval(tick,10000);
var locked=true;
function unlock(){
if(!locked)return;locked=false;clearInterval(tk);
try{localStorage.setItem(HK,"1")}catch(e){}
lk.style.transform="";lk.classList.add("open");
mainEl.inert=false;mus.inert=false;document.body.style.overflow="";
var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){});
setTimeout(function(){lk.hidden=true;window.scrollTo(0,0);focusCur()},650);
}
var sy=null,dy=0;
lk.addEventListener("pointerdown",function(e){sy=e.clientY;dy=0;lk.style.transition="none";try{lk.setPointerCapture(e.pointerId)}catch(x){}});
lk.addEventListener("pointermove",function(e){if(sy===null)return;dy=Math.max(0,sy-e.clientY);lk.style.transform="translateY("+(-dy)+"px)"});
lk.addEventListener("pointerup",function(){
if(sy===null)return;sy=null;lk.style.transition="";
if(dy>80||dy<10)unlock();else lk.style.transform="";
});
lk.addEventListener("pointercancel",function(){sy=null;lk.style.transition="";lk.style.transform=""});
lk.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "||e.key==="ArrowUp"){e.preventDefault();unlock()}});
lk.focus();
function mUi(){var on=!bgm.paused;mus.classList.toggle("on",on);mus.textContent=on?"🔊":"🎵";mus.setAttribute("aria-pressed",on);mus.setAttribute("aria-label",on?"Jeda musik":"Putar musik")}
bgm.addEventListener("play",function(){mus.hidden=false;mUi()});
bgm.addEventListener("pause",mUi);
bgm.addEventListener("error",function(){mus.hidden=true});
mus.addEventListener("click",function(){if(bgm.paused){var p=bgm.play();if(p&&p.catch)p.catch(function(){})}else bgm.pause()});
document.addEventListener("visibilitychange",function(){
if(document.hidden){wasOn=!bgm.paused;bgm.pause()}else if(wasOn){var p=bgm.play();if(p&&p.catch)p.catch(function(){})}
});
